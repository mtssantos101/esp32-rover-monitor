<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Rover Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
            color: #222;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
        }

        .connection {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #777;
        }

        .status-dot.connected {
            background: #22c55e;
        }

        .status-dot.disconnected {
            background: #ef4444;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin: 0 0 15px;
            font-size: 16px;
            color: #666;
        }

        .value {
            font-size: 30px;
            font-weight: bold;
        }

        .unit {
            font-size: 16px;
            color: #777;
            font-weight: normal;
        }

        .obstacle-card {
            transition: 0.2s;
        }

        .obstacle-card.alert {
            background: #fee2e2;
            border: 2px solid #ef4444;
        }

        .obstacle-card.safe {
            background: #dcfce7;
            border: 2px solid #22c55e;
        }

        .obstacle-status {
            font-size: 24px;
            font-weight: bold;
        }

        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .chart-card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .chart-card h2 {
            margin-top: 0;
            font-size: 18px;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        @media (max-width: 1200px) {
            .cards {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 800px) {
            body {
                padding: 15px;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .cards {
                grid-template-columns: 1fr 1fr;
            }

            .charts {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 500px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>ESP32 Rover Dashboard</h1>

    <div class="connection">
        <div id="statusDot" class="status-dot disconnected"></div>
        <span id="connectionStatus">Desconectado</span>
    </div>
</header>

<section class="cards">

    <div class="card">
        <h2>🌡️ Temperatura</h2>
        <div class="value">
            <span id="temperature">--</span>
            <span class="unit">°C</span>
        </div>
    </div>

    <div class="card">
        <h2>💧 Umidade</h2>
        <div class="value">
            <span id="humidity">--</span>
            <span class="unit">%</span>
        </div>
    </div>

    <div class="card">
        <h2>📏 Ultrassônico 1</h2>
        <div class="value">
            <span id="distance1">--</span>
            <span class="unit">cm</span>
        </div>
    </div>

    <div class="card">
        <h2>📏 Ultrassônico 2</h2>
        <div class="value">
            <span id="distance2">--</span>
            <span class="unit">cm</span>
        </div>
    </div>

    <div id="obstacleCard" class="card obstacle-card safe">
        <h2>⚠️ Obstáculo</h2>
        <div id="obstacleStatus" class="obstacle-status">
            LIVRE
        </div>
    </div>

</section>

<section class="charts">

    <div class="chart-card">
        <h2>Temperatura</h2>
        <div class="chart-container">
            <canvas id="temperatureChart"></canvas>
        </div>
    </div>

    <div class="chart-card">
        <h2>Umidade</h2>
        <div class="chart-container">
            <canvas id="humidityChart"></canvas>
        </div>
    </div>

    <div class="chart-card">
        <h2>Distância Ultrassônico 1</h2>
        <div class="chart-container">
            <canvas id="distance1Chart"></canvas>
        </div>
    </div>

    <div class="chart-card">
        <h2>Distância Ultrassônico 2</h2>
        <div class="chart-container">
            <canvas id="distance2Chart"></canvas>
        </div>
    </div>

</section>

<script>
const socket = io();

const MAX_POINTS = 30;

const temperatureChart = new Chart(
    document.getElementById("temperatureChart"),
    {
        type: "line",
        data: {
            labels: [],
            datasets: [
                {
                    label: "Temperatura (°C)",
                    data: [],
                    tension: 0.3
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false
        }
    }
);

const humidityChart = new Chart(
    document.getElementById("humidityChart"),
    {
        type: "line",
        data: {
            labels: [],
            datasets: [
                {
                    label: "Umidade (%)",
                    data: [],
                    tension: 0.3
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false
        }
    }
);

const distance1Chart = new Chart(
    document.getElementById("distance1Chart"),
    {
        type: "line",
        data: {
            labels: [],
            datasets: [
                {
                    label: "Distância 1 (cm)",
                    data: [],
                    tension: 0.3
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    }
);

const distance2Chart = new Chart(
    document.getElementById("distance2Chart"),
    {
        type: "line",
        data: {
            labels: [],
            datasets: [
                {
                    label: "Distância 2 (cm)",
                    data: [],
                    tension: 0.3
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    }
);

function formatTime(timestamp) {
    return new Date(timestamp).toLocaleTimeString("pt-BR");
}

function addData(chart, label, value) {
    if (value === null || value === undefined) {
        return;
    }

    chart.data.labels.push(label);
    chart.data.datasets[0].data.push(value);

    if (chart.data.labels.length > MAX_POINTS) {
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
    }

    chart.update();
}

function updateDashboard(data) {
    document.getElementById("temperature").innerText =
        data.temperature !== null && data.temperature !== undefined
            ? data.temperature.toFixed(2)
            : "--";

    document.getElementById("humidity").innerText =
        data.humidity !== null && data.humidity !== undefined
            ? data.humidity.toFixed(2)
            : "--";

    document.getElementById("distance1").innerText =
        data.distance1 !== null && data.distance1 !== undefined
            ? data.distance1.toFixed(2)
            : "--";

    document.getElementById("distance2").innerText =
        data.distance2 !== null && data.distance2 !== undefined
            ? data.distance2.toFixed(2)
            : "--";

    const obstacleCard = document.getElementById("obstacleCard");
    const obstacleStatus = document.getElementById("obstacleStatus");

    if (data.obstacle) {
        obstacleCard.classList.remove("safe");
        obstacleCard.classList.add("alert");
        obstacleStatus.innerText = "OBSTÁCULO";
    } else {
        obstacleCard.classList.remove("alert");
        obstacleCard.classList.add("safe");
        obstacleStatus.innerText = "LIVRE";
    }

    const time = formatTime(data.timestamp);

    addData(temperatureChart, time, data.temperature);
    addData(humidityChart, time, data.humidity);
    addData(distance1Chart, time, data.distance1);
    addData(distance2Chart, time, data.distance2);
}

socket.on("connect", function() {
    document.getElementById("statusDot").classList.remove("disconnected");
    document.getElementById("statusDot").classList.add("connected");
    document.getElementById("connectionStatus").innerText = "Conectado";
});

socket.on("disconnect", function() {
    document.getElementById("statusDot").classList.remove("connected");
    document.getElementById("statusDot").classList.add("disconnected");
    document.getElementById("connectionStatus").innerText = "Desconectado";
});

socket.on("sensor_data", function(data) {
    updateDashboard(data);
});

async function loadHistoricalData() {
    try {
        const response = await fetch("/api/sensors");
        const data = await response.json();

        const recentData = data.slice(-MAX_POINTS);

        recentData.forEach(updateDashboard);
    } catch (error) {
        console.error("Erro ao carregar historico:", error);
    }
}

loadHistoricalData();
</script>

</body>
</html>
